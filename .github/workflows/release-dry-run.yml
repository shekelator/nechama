name: Release Dry Run

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser-dry-run:
    # Build on Intel macOS so GoReleaser's darwin post-build hook can ad-hoc
    # sign both macOS binaries. The verify step below fails the dry-run if any
    # darwin binary is unsigned, catching regressions before a tagged release,
    # including regressions affecting the darwin/amd64 binary on arm64 hosts.
    runs-on: macos-15-intel
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release artifacts (snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Verify darwin binaries are code-signed
        run: |
          set -e
          for arch in arm64 amd64; do
            bin="$(find dist -path "*darwin_${arch}*/nechama" -type f | head -1)"
            if [ -z "$bin" ]; then
              echo "darwin/${arch} binary not found in dist/" >&2
              exit 1
            fi
            echo "verifying $bin"
            codesign --verify --verbose=2 "$bin"
          done
